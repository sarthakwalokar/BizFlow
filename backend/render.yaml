services:
  - type: web
    name: bizflow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: 3
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: 1
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: 30000
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: 60000
      - key: BIZFLOW_AI_ENABLED
        value: "true"
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct"
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
