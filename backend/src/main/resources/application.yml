server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: bizflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  h2:
    console:
      enabled: false

  datasource:
    url: ${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bizflow_db}}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:30000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:5}
    connect-retries-interval: ${SPRING_FLYWAY_CONNECT_RETRIES_INTERVAL:5}

# Application Custom Properties
app:
  frontend:
    url: ${FRONTEND_URL:https://bizflow-frontend-spa8.onrender.com}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://bizflow-frontend-spa8.onrender.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# BizFlow AI Business Assistant Configuration
bizflow:
  ai:
    enabled: ${BIZFLOW_AI_ENABLED:true}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:${BIZFLOW_AI_OPENROUTER_API_KEY:}}
      model: ${OPENROUTER_MODEL:${BIZFLOW_AI_OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct}}
      base-url: ${OPENROUTER_BASE_URL:${BIZFLOW_AI_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}}
      timeout-ms: ${OPENROUTER_TIMEOUT_MS:${BIZFLOW_AI_OPENROUTER_TIMEOUT_MS:20000}}
    gemini:
      api-key: ${GEMINI_API_KEY:${BIZFLOW_AI_GEMINI_API_KEY:}}
      model: ${GEMINI_MODEL:${BIZFLOW_AI_GEMINI_MODEL:gemini-2.5-flash-lite}}
      base-url: ${GEMINI_BASE_URL:${BIZFLOW_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}
      timeout-ms: ${GEMINI_TIMEOUT_MS:${BIZFLOW_AI_GEMINI_TIMEOUT_MS:20000}}

---
# Local In-Memory Profile (Instant Run without PostgreSQL setup)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:bizflow_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

